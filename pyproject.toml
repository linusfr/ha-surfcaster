[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = [
	"E",
	"F",
	"I",
	"N",
	"B",
	"UP",
	"SIM",
	"C4",
]
ignore = ["W191"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
