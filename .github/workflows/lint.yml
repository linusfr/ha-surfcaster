name: lint

on:  # yamllint disable-line rule:truthy
  push:
    branches:
      - main
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Hermit
        run: curl -fsSL https://github.com/cashapp/hermit/releases/download/stable/install.sh | /bin/bash

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/hermit/python
          key: hermit-python-${{ runner.os }}-${{ hashFiles('bin/hermit.hcl') }}

      - name: Install test deps
        run: |
          source bin/activate-hermit
          pip3 install pytest pytest-homeassistant-custom-component pytest-cov

      - name: Lint & Test
        run: |
          source bin/activate-hermit
          ruff check .
          ruff format --check .
          yamllint .
          prek run --all-files
          python3 -m pytest tests/ -v
