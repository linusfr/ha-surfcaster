name: release

on:  # yamllint disable-line rule:truthy
  push:
    branches:
      - main

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Hermit
        run: curl -fsSL https://github.com/cashapp/hermit/releases/download/stable/install.sh | /bin/bash

      - name: Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          source bin/activate-hermit
          semantic-release \
            --allow-no-changes \
            --provider-opt log_order=ctime \
            --provider-opt strip_v_tag_prefix=true \
            --commit-analyzer-opt 'patch_release_rules=fix,chore(deps)'

      - name: Inject version
        if: success()
        run: |
          source bin/activate-hermit
          VERSION=$(git describe --tags --abbrev=0)
          sed -i "s|\"version\": \"[^\"]*\"|\"version\": \"$VERSION\"|" custom_components/surfcaster/manifest.json
          sed -i "s|VERSION = \"[^\"]*\"|VERSION = \"$VERSION\"|" custom_components/surfcaster/const.py
          git config user.email "github-actions@github.com"
          git config user.name "github-actions"
          git add custom_components/surfcaster/manifest.json custom_components/surfcaster/const.py
          git commit -m "chore: bump manifest version to $VERSION [skip ci]" || true
          git push
