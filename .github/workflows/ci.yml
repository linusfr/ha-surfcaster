name: ci

on:  # yamllint disable-line rule:truthy
  push:
    branches:
      - main
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Hermit
        run: curl -fsSL https://github.com/cashapp/hermit/releases/download/stable/install.sh | /bin/bash

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/hermit/python
          key: hermit-python-${{ runner.os }}-${{ hashFiles('bin/hermit.hcl') }}

      - name: Install test deps
        run: |
          source bin/activate-hermit
          pip3 install pytest pytest-homeassistant-custom-component pytest-cov

      - name: Lint & Test
        run: |
          source bin/activate-hermit
          ruff check .
          ruff format --check .
          yamllint .
          python3 -m pytest tests/ -v

  release:
    needs: lint
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Hermit
        run: curl -fsSL https://github.com/cashapp/hermit/releases/download/stable/install.sh | /bin/bash

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          source bin/activate-hermit
          OPTS="--provider-opt log_order=ctime --provider-opt strip_v_tag_prefix=true --commit-analyzer-opt 'patch_release_rules=fix,chore(deps)'"

          # 1. Compute next version. Empty => nothing releasable, stop.
          DRY=$(semantic-release --dry $OPTS 2>&1 || true)
          echo "$DRY"
          VERSION=$(echo "$DRY" | grep -oiP '(?<=new version: )\d+\.\d+\.\d+' || true)
          if [ -z "$VERSION" ]; then echo "no release"; exit 0; fi

          # 2. Idempotent: if the release already exists, nothing to do.
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "release $VERSION already exists"; exit 0
          fi

          # 3. Inject version into manifest + const so the source tarball
          #    HACS downloads carries the right version + icon.
          sed -i "s|\"version\": \"[^\"]*\"|\"version\": \"$VERSION\"|" custom_components/surfcaster/manifest.json
          sed -i "s|VERSION = \"[^\"]*\"|VERSION = \"$VERSION\"|" custom_components/surfcaster/const.py

          # 4. Commit the bump only if it actually changed something
          #    (a prior interrupted run may have committed it already).
          git config user.email "github-actions@github.com"
          git config user.name "github-actions"
          git add custom_components/surfcaster/manifest.json custom_components/surfcaster/const.py
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): $VERSION"
            git push origin HEAD:main
          fi

          # 5. Cut the GitHub Release + tag AT the current commit (now carries
          #    the version + icon). Tag sits on that commit, so the follow-up
          #    run finds 0 releasable commits and exits — no loop.
          gh release create "$VERSION" \
            --target "$(git rev-parse HEAD)" \
            --title "$VERSION" \
            --generate-notes
